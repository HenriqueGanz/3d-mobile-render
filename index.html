<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101418">
  <title>WebAR 1:1 — catálogo de objetos</title>

  <!-- model-viewer 4.3.1 (versao pinada: nao use @latest em teste de campo) -->
  <script type="module"
          src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js"></script>

  <link rel="stylesheet" href="./styles.css">
</head>
<body>

  <div class="app" id="app">

    <main class="palco">
      <model-viewer
        id="viewer"
        alt="Modelo 3D em escala real"
        ar
        ar-modes="webxr scene-viewer quick-look"
        ar-scale="fixed"
        ar-placement="floor"
        xr-environment
        camera-controls
        touch-action="pan-y"
        shadow-intensity="1"
        environment-image="neutral"
        loading="eager">

        <button id="ar-button" slot="ar-button">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 2 3 7v10l9 5 9-5V7z"></path>
            <path d="M3 7l9 5 9-5M12 12v10"></path>
          </svg>
          Ver no meu espaço
        </button>

        <div id="ar-prompt" slot="ar-prompt">
          Aponte a câmera para a mesa e mova o celular devagar para o app encontrar a superfície.
        </div>
      </model-viewer>
    </main>

    <aside class="catalogo">
      <div class="catalogo-cabecalho">
        <h1>Objetos</h1>
        <small id="contador">—</small>
      </div>
      <div class="lista" id="lista" role="group" aria-label="Catálogo de objetos"></div>
    </aside>

  </div>

  <details id="diag">
    <summary>Diagnóstico</summary>
    <dl>
      <dt>objeto</dt>      <dd id="d-item">—</dd>
      <dt>origem</dt>      <dd id="d-origem">—</dd>
      <dt>catálogo</dt>    <dd id="d-catalogo">carregando…</dd>
      <dt>aviso</dt>       <dd id="d-aviso">—</dd>
      <dt>dimensões</dt>   <dd id="d-dims">—</dd>
      <dt>escala</dt>      <dd id="d-escala">—</dd>
      <dt>usdz (iOS)</dt>  <dd id="d-usdz">—</dd>
      <dt>protocolo</dt>   <dd id="d-proto">—</dd>
      <dt>webxr</dt>       <dd id="d-webxr">verificando…</dd>
      <dt>botão ar</dt>    <dd id="d-canar">—</dd>
      <dt>status ar</dt>   <dd id="d-arstatus">not-presenting</dd>
      <dt>tracking</dt>    <dd id="d-tracking">—</dd>
      <dt>carregamento</dt><dd id="d-load">—</dd>
    </dl>
  </details>

  <script type="module" src="./app.js"></script>
</body>
</html>
